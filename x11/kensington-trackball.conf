# Kensington Expert Mouse Pro (USB) configuration for Xorg.
# Compatibility copy: the maintained file is x11/kensington-trackball.conf.
# This file is not read by Wayland compositors. See docs/wayland.md.

Section "InputClass"
  Identifier "Kensington Expert Mouse Pro"
  Driver "libinput"
  MatchProduct "Kensington Kensington USB/PS2 Trackball"
  Option "ScrollMethod" "Button"
  Option "ScrollButton" "3"
  Option "ButtonMapping" "1 2 9 4 5 6 7 8 3 10 11 12 13 14 15"
EndSection
